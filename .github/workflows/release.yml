name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy npm ci
      - name: Validate release commit and tag
        run: |
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || {
            echo "Release tag must point to the current origin/main commit." >&2
            exit 1
          }
          node skills/hyperframes-sports-director/scripts/check_release.mjs --check-only --tag "$GITHUB_REF_NAME"
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy npm test
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy npm run test:contracts
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy npm run test:media
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy npm run test:skill
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy npm run eval
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy npm run check

  archive:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy npm ci
      - name: Build release archive
        run: env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u NO_PROXY -u http_proxy -u https_proxy -u all_proxy -u no_proxy npm run release:package -- --tag "$GITHUB_REF_NAME"
      - name: Verify release checksum
        working-directory: dist
        run: sha256sum -c "hyperframes-sports-director-${{ github.ref_name }}.skill.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hyperframes-sports-director-${{ github.ref_name }}
          path: |
            dist/hyperframes-sports-director-${{ github.ref_name }}.skill
            dist/hyperframes-sports-director-${{ github.ref_name }}.skill.sha256

  publish:
    needs: [verify, archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hyperframes-sports-director-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$tag_type" = "tag" ]; then
            annotated_sha="$tag_sha"
            tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$annotated_sha" --jq .object.type)
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$annotated_sha" --jq .object.sha)
          fi
          test "$tag_type" = "commit"
          test "$tag_sha" = "$GITHUB_SHA"
          test "$main_sha" = "$GITHUB_SHA"

          archive="dist/hyperframes-sports-director-${{ github.ref_name }}.skill"
          checksum="${archive}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_dir="$RUNNER_TEMP/hyperframes-existing-release"
            mkdir -p "$release_dir"
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$(basename "$archive")" \
              --pattern "$(basename "$checksum")" \
              --dir "$release_dir"
            cmp --silent "$archive" "$release_dir/$(basename "$archive")"
            cmp --silent "$checksum" "$release_dir/$(basename "$checksum")"
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

          release_json=$(gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets)
          jq -e \
            --arg tag "$GITHUB_REF_NAME" \
            --arg archive "$(basename "$archive")" \
            --arg checksum "$(basename "$checksum")" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and
             ([.assets[].name] | sort) == ([$archive, $checksum] | sort)' \
            <<<"$release_json"
